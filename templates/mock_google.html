<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Accounts - Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
        }
    </style>
</head>
<body class="min-h-screen bg-[#faf7f2] flex items-center justify-center p-4">
    <main class="w-full max-w-[450px] bg-white rounded-2xl border border-stone-200 shadow-lg p-8 sm:p-10 space-y-6">
        <div class="text-center space-y-4">
            <!-- Google Logo SVG -->
            <svg class="h-6 w-auto mx-auto" viewBox="0 0 24 24" width="24" height="24" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            <div>
                <h1 class="text-2xl font-normal text-[#202124]">Sign in with Google</h1>
                <p class="text-sm text-[#5f6368] mt-1.5">to continue to <span class="font-medium text-[#1e2421]">Gebeta Nutrition</span></p>
            </div>
        </div>

        <div class="rounded-xl bg-amber-50 border border-amber-200 p-4 text-xs text-amber-800 space-y-1">
            <p class="font-bold">🛠️ Google OAuth Simulator Mode</p>
            <p>We detected that no real Google OAuth Client Credentials are configured. You can use this interactive screen to simulate a successful Google callback.</p>
        </div>

        <form method="GET" action="/auth/google/callback" class="space-y-4">
            <label class="block space-y-1">
                <span class="text-xs font-semibold text-[#5f6368]">Full Name</span>
                <input type="text" name="mock_name" required value="Yohannes Samuel" class="w-full rounded-md border border-[#dadce0] px-3 py-2 text-sm outline-none focus:border-[#1a73e8] focus:ring-1 focus:ring-[#1a73e8]">
            </label>

            <label class="block space-y-1">
                <span class="text-xs font-semibold text-[#5f6368]">Email address</span>
                <input type="email" name="mock_email" required value="samiz@gmail.com" class="w-full rounded-md border border-[#dadce0] px-3 py-2 text-sm outline-none focus:border-[#1a73e8] focus:ring-1 focus:ring-[#1a73e8]">
            </label>

            <label class="block space-y-1">
                <span class="text-xs font-semibold text-[#5f6368]">Google Account Unique ID (sub)</span>
                <input type="text" name="mock_id" required value="google_user_12345" class="w-full rounded-md border border-[#dadce0] bg-[#f8f9fa] px-3 py-2 text-sm outline-none" readonly>
            </label>

            <div class="flex items-center justify-between pt-2">
                <a href="/login" class="text-sm font-medium text-[#1a73e8] hover:text-[#174ea6]">Cancel</a>
                <button type="submit" class="rounded bg-[#1a73e8] hover:bg-[#1b66ca] px-5 py-2 text-sm font-medium text-white transition-all shadow">
                    Accept & Continue
                </button>
            </div>
        </form>
    </main>
</body>
</html>
